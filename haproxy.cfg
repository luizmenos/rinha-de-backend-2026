global
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend front
    bind *:9999
    default_backend apis

backend apis    
    balance roundrobin
    default-server check maxconn 20
    server api1 unix@/run/sockets/api-1.sock check
    server api2 unix@/run/sockets/api-2.sock check
