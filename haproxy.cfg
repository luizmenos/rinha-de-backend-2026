global
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend front
    bind *:9999
    default_backend apis

backend apis    
    balance roundrobin
    default-server check maxconn 20
    server api1 api-1:8080 check
    server api2 api-2:8080 check
